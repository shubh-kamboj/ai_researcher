[project]
name = "ai-researcher"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
authors = [
    { name = "Shubham Kamboj", email = "shubhamkamboj2010@gmail.com" }
]
requires-python = ">=3.12"
dependencies = [
    "langchain>=1.4.7",
    "langchain-core>=1.7.3",
    "langchain-google-genai>=4.4.2",
    "langgraph>=1.2.19",
    "pypdf>=6.21.4",
    "pypdf2>=3.0.1",
    "python-dotenv>=1.2.4",
    "reportlab>=5.1.0",
    "requests>=2.34.2",
]

[project.scripts]
ai-researcher = "ai_researcher:main"

[build-system]
requires = ["uv_build>=0.13.6,<0.14.0"]
build-backend = "uv_build"
